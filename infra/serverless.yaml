AWSTemplateFormatVersion: '2010-09-09'
Description: HavenLink candidate serverless data/API plane (no production resources)
Parameters:
  AppName: { Type: String, Default: havenlink }
  Environment: { Type: String, Default: candidate }
  ImageUri: { Type: String }
  ApiDomainName: { Type: String }
  ProductionDomainName: { Type: String, Default: havenlink.org }
  HostedZoneId: { Type: AWS::Route53::HostedZone::Id }
  ExistingDatabaseSecretArn: { Type: String }
  ExistingSessionSecretArn: { Type: String }
  ExistingGoogleClientSecretArn: { Type: String }
  ExistingSmtpSecretArn: { Type: String }
  ExistingVertexSecretArn: { Type: String }
  GoogleClientId: { Type: String }
  GoogleCallbackUrl: { Type: String }
  AppBaseUrl: { Type: String }
  EmailFrom: { Type: String }
  SmtpHost: { Type: String, Default: email-smtp.us-east-1.amazonaws.com }
  SmtpPort: { Type: String, Default: '587' }
  SmtpUser: { Type: String, NoEcho: true }
  SesConfigurationSetName: { Type: String, Default: my-first-configuration-set }
  GoogleCloudProject: { Type: String, Default: havenlink-500500 }
  GeminiLocation: { Type: String, Default: us-central1 }
  GoogleMapsApiKey: { Type: String, NoEcho: true }
Resources:
  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AppName}-prod-data'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: EmailPK, AttributeType: S }
        - { AttributeName: EmailSK, AttributeType: S }
        - { AttributeName: GooglePK, AttributeType: S }
        - { AttributeName: GoogleSK, AttributeType: S }
        - { AttributeName: TokenUserPK, AttributeType: S }
        - { AttributeName: TokenUserSK, AttributeType: S }
      KeySchema: [{ AttributeName: PK, KeyType: HASH }, { AttributeName: SK, KeyType: RANGE }]
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema: [{ AttributeName: EmailPK, KeyType: HASH }, { AttributeName: EmailSK, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
        - IndexName: GoogleSubIndex
          KeySchema: [{ AttributeName: GooglePK, KeyType: HASH }, { AttributeName: GoogleSK, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
        - IndexName: TokenUserIndex
          KeySchema: [{ AttributeName: TokenUserPK, KeyType: HASH }, { AttributeName: TokenUserSK, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
      SSESpecification: { SSEEnabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      DeletionProtectionEnabled: true
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AppName}-${Environment}'
      RetentionInDays: 14

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-${Environment}-lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:BatchGetItem, dynamodb:BatchWriteItem, dynamodb:DeleteItem, dynamodb:DescribeTable, dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:TransactWriteItems]
                Resource:
                  - !GetAtt DataTable.Arn
                  - !Sub '${DataTable.Arn}/index/*'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LambdaLogGroup.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref ExistingDatabaseSecretArn
                  - !Ref ExistingSessionSecretArn
                  - !Ref ExistingGoogleClientSecretArn
                  - !Ref ExistingSmtpSecretArn
                  - !Ref ExistingVertexSecretArn
              - Effect: Allow
                Action: ses:SendEmail
                Resource:
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/havenlink.org'
                  # SES applies the identity's default configuration set even
                  # when the application omits ConfigurationSetName. The role
                  # therefore needs the narrowly scoped configuration-set ARN
                  # as well as the verified sending identity.
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${SesConfigurationSetName}'

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Sub '${AppName}-${Environment}'
      PackageType: Image
      Architectures: [arm64]
      # Extra CPU at 2048 MB materially reduces cold-start initialization for
      # the bundled Node runtime and static asset manifest. It is still
      # pay-per-request and avoids a permanent provisioned-concurrency charge
      # while the account quota request is pending.
      MemorySize: 2048
      Timeout: 30
      Role: !GetAtt LambdaRole.Arn
      Code: { ImageUri: !Ref ImageUri }
      Environment:
        Variables:
          NODE_ENV: production
          DATA_BACKEND: dynamodb
          DDB_TABLE: !Ref DataTable
          APP_BASE_URL: !Ref AppBaseUrl
          PORT: '3000'
          SESSION_SECRET: !Sub '{{resolve:secretsmanager:${ExistingSessionSecretArn}:SecretString}}'
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Sub '{{resolve:secretsmanager:${ExistingGoogleClientSecretArn}:SecretString}}'
          GOOGLE_CALLBACK_URL: !Ref GoogleCallbackUrl
          EMAIL_FROM: !Ref EmailFrom
          SMTP_HOST: !Ref SmtpHost
          SMTP_PORT: !Ref SmtpPort
          SMTP_SECURE: 'false'
          SMTP_USER: !Ref SmtpUser
          SMTP_PASSWORD: !Sub '{{resolve:secretsmanager:${ExistingSmtpSecretArn}:SecretString}}'
          EMAIL_TRANSPORT: ses
          GEMINI_USE_VERTEX: 'true'
          GOOGLE_CLOUD_PROJECT: !Ref GoogleCloudProject
          GEMINI_LOCATION: !Ref GeminiLocation
          GEMINI_SA_KEY: !Sub '{{resolve:secretsmanager:${ExistingVertexSecretArn}:SecretString}}'
          GOOGLE_MAPS_API_KEY: !Ref GoogleMapsApiKey

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties: { Name: !Sub '${AppName}-${Environment}', ProtocolType: HTTP, CorsConfiguration: { AllowCredentials: true, AllowHeaders: ['content-type', 'x-csrf-token'], AllowMethods: ['*'], AllowOrigins: ['https://havenlink.org', 'https://www.havenlink.org'] } }
  HttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'
  ProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'ANY /{proxy+}', Target: !Sub 'integrations/${HttpIntegration}' }
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: '$default', Target: !Sub 'integrations/${HttpIntegration}' }
  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties: { ApiId: !Ref HttpApi, StageName: '$default', AutoDeploy: true }
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties: { Action: lambda:InvokeFunction, FunctionName: !Ref ApiFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*' }

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref ProductionDomainName
      SubjectAlternativeNames:
        - !Sub 'www.${ProductionDomainName}'
        - !Ref ApiDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - { DomainName: !Ref ProductionDomainName, HostedZoneId: !Ref HostedZoneId }
        - { DomainName: !Sub 'www.${ProductionDomainName}', HostedZoneId: !Ref HostedZoneId }
        - { DomainName: !Ref ApiDomainName, HostedZoneId: !Ref HostedZoneId }
  CustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties: { DomainName: !Ref ApiDomainName, DomainNameConfigurations: [{ CertificateArn: !Ref Certificate, EndpointType: REGIONAL, SecurityPolicy: TLS_1_2 }] }
  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    DependsOn: DefaultStage
    Properties: { ApiId: !Ref HttpApi, DomainName: !Ref CustomDomain, Stage: !Ref DefaultStage }
  CandidateRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: A
      AliasTarget: { DNSName: !GetAtt CustomDomain.RegionalDomainName, HostedZoneId: !GetAtt CustomDomain.RegionalHostedZoneId }

  MigrationCheckpointBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AppName}-migration-checkpoints-${AWS::AccountId}'
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }

Outputs:
  TableName: { Value: !Ref DataTable }
  ApiEndpoint: { Value: !Sub 'https://${ApiDomainName}' }
  ApiRegionalDomainName: { Value: !GetAtt CustomDomain.RegionalDomainName }
  ApiRegionalHostedZoneId: { Value: !GetAtt CustomDomain.RegionalHostedZoneId }
  LambdaArn: { Value: !GetAtt ApiFunction.Arn }
  MigrationCheckpointBucket: { Value: !Ref MigrationCheckpointBucket }
