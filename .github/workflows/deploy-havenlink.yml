name: Deploy HavenLink serverless

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  APP_NAME: ${{ vars.APP_NAME }}
  DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
  # Include the run ID and attempt so a failed deployment can be retried without
  # trying to overwrite an immutable ECR tag that an earlier attempt already pushed.
  # The run ID stays the same on "Re-run failed jobs"; only the attempt changes.
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  ECR_REPOSITORY: havenlink-serverless
  STACK_NAME: havenlink-serverless-candidate

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure immutable ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-tag-mutability IMMUTABLE \
              --image-scanning-configuration scanOnPush=true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Anonymous pulls from public.ecr.aws are capped per IP each month, and GitHub
      # runners share IPs with other projects, so it can answer "429 Data limit
      # exceeded" (deploy 4.1 failed that way). The deploy role can't log in to ECR
      # Public, so the Lambda adapter is vendored and Node comes from the first
      # registry that answers; all three serve the same Docker Official Image.
      - name: Pick a reachable Node base image
        id: node-image
        run: |
          for image in \
            mirror.gcr.io/library/node:20-slim \
            public.ecr.aws/docker/library/node:20-slim \
            docker.io/library/node:20-slim; do
            for attempt in 1 2 3; do
              if docker buildx imagetools inspect --raw "$image" >/dev/null; then
                echo "Using $image"
                echo "image=$image" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep $((attempt * 5))
            done
          done
          echo "::error::No registry served node:20-slim"
          exit 1

      - name: Build and push ARM64 Lambda image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lambda
          platforms: linux/arm64
          provenance: false
          build-args: NODE_IMAGE=${{ steps.node-image.outputs.image }}
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy serverless candidate stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/serverless.yaml \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              AppName="$APP_NAME" \
              Environment=candidate \
              ImageUri="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
              ApiDomainName="serverless-api.${DOMAIN_NAME}" \
              ProductionDomainName="$DOMAIN_NAME" \
              HostedZoneId="${{ vars.HOSTED_ZONE_ID }}" \
              ExistingDatabaseSecretArn="${{ secrets.DATABASE_URL_SECRET_ARN }}" \
              ExistingSessionSecretArn="${{ secrets.SESSION_SECRET_SECRET_ARN }}" \
              ExistingGoogleClientSecretArn="${{ secrets.GOOGLE_CLIENT_SECRET_SECRET_ARN }}" \
              ExistingSmtpSecretArn="${{ secrets.SMTP_PASSWORD_SECRET_ARN }}" \
              ExistingVertexSecretArn="arn:aws:secretsmanager:${AWS_REGION}:930218373857:secret:havenlink/gemini-sa-key-IMpmoT" \
              GoogleClientId="${{ vars.GOOGLE_CLIENT_ID }}" \
              GoogleCallbackUrl="${{ vars.GOOGLE_CALLBACK_URL }}" \
              AppBaseUrl="https://${DOMAIN_NAME}" \
              EmailFrom="${{ vars.EMAIL_FROM }}" \
              SmtpHost="${{ vars.SMTP_HOST }}" \
              SmtpPort="${{ vars.SMTP_PORT }}" \
              SmtpUser="${{ secrets.SMTP_USER }}" \
              GoogleCloudProject=havenlink-500500 \
              GeminiLocation=us-central1 \
              GoogleMapsApiKey="${{ secrets.GOOGLE_MAPS_API_KEY }}"

      - name: Verify production health and critical static assets
        run: |
          curl --fail-with-body --retry 5 --retry-delay 2 "https://${DOMAIN_NAME}/health"
          curl --fail --retry 5 --retry-delay 2 "https://${DOMAIN_NAME}/home" -o /dev/null
          curl --fail --retry 5 --retry-delay 2 "https://${DOMAIN_NAME}/png/asadsadikov.webp" -o /dev/null

      - name: Print stack outputs
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table

      - name: Diagnose stack failure (read-only)
        if: failure()
        run: |
          set +e
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query 'Stacks[0].[StackName,StackStatus,StackStatusReason]' --output text
          aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query "StackEvents[?contains(ResourceStatus,'FAILED')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output text | head -60
