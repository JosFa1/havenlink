name: Deploy HavenLink

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  APP_NAME: ${{ vars.APP_NAME }}
  STACK_NAME: ${{ vars.STACK_NAME }}
  DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file deploy/cloudformation/havenlink-ecs-fargate.yml \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              AppName="$APP_NAME" \
              DomainName="$DOMAIN_NAME" \
              VpcId="${{ vars.VPC_ID }}" \
              PublicSubnets="subnet-0fd862b2f26316d03,subnet-046458b437630e1ad" \
              EcsSecurityGroupId="${{ vars.ECS_SECURITY_GROUP_ID }}" \
              ImageUri="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
              ContainerPort="${{ vars.CONTAINER_PORT }}" \
              DesiredCount="${{ vars.DESIRED_COUNT }}" \
              TaskCpu="256" \
              TaskMemory="512" \
              CertificateArn="${{ vars.CERTIFICATE_ARN }}" \
              DatabaseUrlSecretArn="${{ secrets.DATABASE_URL_SECRET_ARN }}" \
              SessionSecretSecretArn="${{ secrets.SESSION_SECRET_SECRET_ARN }}" \
              GoogleClientSecretSecretArn="${{ secrets.GOOGLE_CLIENT_SECRET_SECRET_ARN }}" \
              SmtpPasswordSecretArn="${{ secrets.SMTP_PASSWORD_SECRET_ARN }}" \
              GoogleClientId="${{ vars.GOOGLE_CLIENT_ID }}" \
              GoogleCallbackUrl="${{ vars.GOOGLE_CALLBACK_URL }}" \
              EmailFrom="${{ vars.EMAIL_FROM }}" \
              SmtpHost="${{ vars.SMTP_HOST }}" \
              SmtpPort="${{ vars.SMTP_PORT }}" \
              SmtpSecure="${{ vars.SMTP_SECURE }}" \
              SmtpUser="${{ secrets.SMTP_USER }}" \
              GeminiSaKeySecretArn="${{ secrets.GEMINI_SA_KEY_SECRET_ARN }}" \
              GeminiUseVertex="true" \
              GoogleCloudProject="havenlink-500500" \
              GeminiLocation="us-central1"

      - name: Diagnose environment (read-only)
        if: always()
        run: |
          set +e
          R="$AWS_REGION"
          echo "########## TASK DEF REVISION HISTORY (did any prod task carry GEMINI_SA_KEY?) ##########"
          for td in $(aws ecs list-task-definitions --family-prefix havenlink-task --sort DESC --region "$R" --query 'taskDefinitionArns[0:30]' --output text); do
            rev="${td##*/}"
            reg=$(aws ecs describe-task-definition --task-definition "$td" --region "$R" --query 'taskDefinition.registeredAt' --output text 2>/dev/null)
            secs=$(aws ecs describe-task-definition --task-definition "$td" --region "$R" --query 'taskDefinition.containerDefinitions[0].secrets[].name' --output text 2>/dev/null)
            vtx=$(aws ecs describe-task-definition --task-definition "$td" --region "$R" --query "taskDefinition.containerDefinitions[0].environment[?name=='GEMINI_USE_VERTEX'].value | [0]" --output text 2>/dev/null)
            img=$(aws ecs describe-task-definition --task-definition "$td" --region "$R" --query 'taskDefinition.containerDefinitions[0].image' --output text 2>/dev/null)
            gem="no"; echo "$secs" | grep -q GEMINI_SA_KEY && gem="YES"
            echo "$rev | registered=$reg | GEMINI_SA_KEY=$gem | VERTEX=$vtx | img=${img##*:} | secrets=[$secs]"
          done
          echo
          echo "########## APP RUNNER (all regions) ##########"
          for rr in us-east-1 us-east-2 us-west-2 us-west-1; do
            echo "region $rr:"; aws apprunner list-services --region "$rr" --query 'ServiceSummaryList[].[ServiceName,Status,ServiceUrl]' --output text 2>&1 | head -5
          done
          echo
          echo "########## ECS SERVICE DEPLOYMENT HISTORY ##########"
          aws ecs describe-services --cluster "${APP_NAME}-cluster" --services "${APP_NAME}-service" --region "$R" \
            --query 'services[0].deployments[].[status,rolloutState,createdAt,taskDefinition]' --output text 2>/dev/null
          echo
          echo "########## CLOUDFORMATION STACK STATUS ##########"
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$R" \
            --query 'Stacks[0].[StackName,StackStatus,StackStatusReason]' --output text
          echo
          echo "########## STACK EVENTS: FAILURES (most recent first) ##########"
          aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --region "$R" \
            --query "StackEvents[?contains(ResourceStatus,'FAILED')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output text | head -60
          echo
          echo "########## STACK EVENTS: latest 30 (all) ##########"
          aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --region "$R" \
            --query "StackEvents[0:30].[Timestamp,LogicalResourceId,ResourceStatus]" --output text
          echo
          echo "########## RDS INSTANCES ##########"
          aws rds describe-db-instances --region "$R" \
            --query "DBInstances[].[DBInstanceIdentifier,DBInstanceStatus,Engine,Endpoint.Address]" --output text
          echo
          echo "########## ECS CLUSTERS / SERVICES ##########"
          for c in $(aws ecs list-clusters --region "$R" --query 'clusterArns' --output text); do
            echo "cluster: $c"
            aws ecs describe-services --cluster "$c" --services "${APP_NAME}-service" --region "$R" \
              --query 'services[0].[status,desiredCount,runningCount,pendingCount]' --output text 2>/dev/null
            aws ecs describe-services --cluster "$c" --services "${APP_NAME}-service" --region "$R" \
              --query 'services[0].events[0:8].message' --output text 2>/dev/null
          done
          echo
          echo "########## STOPPED TASK REASONS ##########"
          CL="${APP_NAME}-cluster"
          for t in $(aws ecs list-tasks --cluster "$CL" --desired-status STOPPED --region "$R" --query 'taskArns' --output text 2>/dev/null); do
            aws ecs describe-tasks --cluster "$CL" --tasks "$t" --region "$R" \
              --query 'tasks[0].[stoppedReason,containers[0].reason,containers[0].exitCode]' --output text
          done
          echo
          echo "########## APP RUNNER SERVICES ##########"
          aws apprunner list-services --region "$R" --query 'ServiceSummaryList[].[ServiceName,Status,ServiceUrl]' --output text 2>/dev/null
          echo
          echo "########## LOAD BALANCERS ##########"
          aws elbv2 describe-load-balancers --region "$R" --query 'LoadBalancers[].[LoadBalancerName,State.Code,DNSName]' --output text 2>/dev/null
          echo
          echo "########## ROUTE53: havenlink records ##########"
          for z in $(aws route53 list-hosted-zones --query 'HostedZones[].Id' --output text 2>/dev/null); do
            aws route53 list-resource-record-sets --hosted-zone-id "$z" \
              --query "ResourceRecordSets[?contains(Name,'havenlink')].[Name,Type,AliasTarget.DNSName,ResourceRecords[0].Value]" --output text 2>/dev/null
          done
          echo
          echo "########## RECENT APP LOGS (/ecs/${APP_NAME}) ##########"
          aws logs tail "/ecs/${APP_NAME}" --since 30m --region "$R" --format short 2>/dev/null | tail -60
          true

      - name: Print stack outputs
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table
