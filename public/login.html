<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/png/logo.png">
  <title>Sign In - HavenLink</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .auth-wrap { max-width: 440px; margin: 4rem auto; padding: 0 1.5rem; }
    .auth-card {
      background: var(--white); border: 1px solid var(--gray-light);
      border-radius: 0.75rem; box-shadow: var(--shadow-md); padding: 2.5rem;
    }
    .auth-card h1 { margin: 0 0 0.5rem; color: var(--navy); font-size: 1.6rem; }
    .auth-sub { color: var(--text-light); margin: 0 0 1.75rem; }
    .auth-card .btn { width: 100%; }
    .auth-divider { text-align: center; color: var(--text-light); margin: 1.25rem 0; position: relative; }
    .auth-divider::before, .auth-divider::after {
      content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: var(--gray-light);
    }
    .auth-divider::before { left: 0; } .auth-divider::after { right: 0; }
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      background: var(--white); color: var(--text-dark); border: 2px solid var(--gray-light);
    }
    .btn-google:hover { border-color: var(--blue-lighter); transform: translateY(-2px); }
    .auth-foot { text-align: center; margin-top: 1.5rem; color: var(--text-light); }
    .form-message { display: none; margin-bottom: 1.25rem; }
    .form-message-error { background: #fef2f2; border-left-color: #ef4444; color: #991b1b; }
    .form-message-success { background: #f0fdf4; border-left-color: #22c55e; color: #166534; }
    .form-message-info { background: #eff6ff; border-left-color: #3b82f6; color: #1e40af; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/home" class="nav-brand">
        <img src="/png/logo.png" alt="HavenLink Logo" class="logo-icon">
        <span class="logo-text"><span class="logo-haven">Haven</span><span class="logo-link">Link</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="/home" class="nav-link">Home</a></li>
        <li id="navAuth"></li>
      </ul>
    </div>
  </nav>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-sub">Sign in to your HavenLink account.</p>

      <div id="formMessage" class="form-message" role="status" aria-live="polite"></div>

      <a href="/auth/google" class="btn btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.71-1.57 2.68-3.89 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Continue with Google
      </a>

      <div class="auth-divider">or</div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <p class="auth-foot">Don't have an account? <a href="/signup">Sign up</a></p>
    </div>
  </main>

  <script src="/account.js"></script>
</body>
</html>
