<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/png/logo.png">
  <title>Sign In — HavenLink</title>
  <link rel="preload" href="/fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/satoshi-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/editorial.css">
  <link rel="stylesheet" href="/auth.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body class="editorial auth">
  <main class="au-shell">

    <!-- Scene: the threshold -->
    <aside class="au-scene hm-on-ink">
      <canvas id="auLoom" aria-hidden="true"></canvas>
      <a href="/home" class="au-brand">
        <img src="/png/logo.png" alt="HavenLink Logo" class="logo-icon">
        <span class="logo-text"><span class="logo-haven">Haven</span><span class="logo-link">Link</span></span>
      </a>
      <p class="au-statement">The porch light is <em>on.</em></p>
      <p class="au-scene-meta">HavenLink · A protected space for families</p>
    </aside>

    <!-- Form pane -->
    <section class="au-pane">
      <a href="/home" class="au-back"><span aria-hidden="true">&larr;</span> Back to home</a>

      <div class="au-form-wrap">
        <header class="au-eyebrow hm-reveal">
          <span class="hm-eyebrow">Sign in</span>
          <span class="hm-index">01</span>
        </header>

        <h1 class="au-title hm-reveal" style="--d: .06s">Welcome back</h1>
        <p class="au-sub hm-reveal" style="--d: .12s">Sign in to your HavenLink account.</p>

        <div id="formMessage" class="form-message" role="status" aria-live="polite"></div>

        <a href="/auth/google" class="au-google hm-reveal" style="--d: .18s">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.71-1.57 2.68-3.89 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
          Continue with Google
        </a>

        <div class="au-divider hm-reveal" style="--d: .24s" aria-hidden="true">or</div>

        <form id="loginForm" novalidate class="hm-reveal" style="--d: .3s">
          <div class="au-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="au-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="hm-btn hm-btn--ink au-submit">Sign In <span class="hm-btn-arrow">&rarr;</span></button>
        </form>

        <p class="au-foot hm-reveal" style="--d: .36s">Don't have an account? <a href="/signup">Sign up</a></p>
      </div>
    </section>

  </main>

  <script src="/account.js"></script>
  <script src="/editorial.js" defer></script>
  <script src="/auth.js" defer></script>
</body>
</html>
